[project]
name = "telegct-collector-workspace"
version = "0.0.0"
description = "uv workspace root for telegct ingestion code (not published)"
requires-python = ">=3.12"
dependencies = ["telegct-common"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["libs/python/telegct_common"]

[tool.uv.sources]
telegct-common = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine; tests use them

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["libs/python"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs/python"]
markers = ["integration: needs Docker (testcontainers); deselect with -m 'not integration'"]
